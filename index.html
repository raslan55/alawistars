 <!-- Google Tag Manager (deferred loader) -->

<script>
  // Defer loading GTM until user interaction or idle to improve LCP
  (function(){
    var gtmId = 'GTM-5SN7Z7JS';
    var loaded = false;
    function loadGTM(){
      if(loaded) return; loaded = true;
      var d = document, s = 'script', f = d.getElementsByTagName(s)[0];
      var j = d.createElement(s); j.async = true; j.src = 'https://www.googletagmanager.com/gtm.js?id=' + gtmId;
      f.parentNode.insertBefore(j, f);
    }
    // Load after short idle period
    if ('requestIdleCallback' in window) {
      requestIdleCallback(function(){ setTimeout(loadGTM, 1500); }, {timeout: 3000});
    } else {
      setTimeout(loadGTM, 3000);
    }
    // Also load on first user interaction
    ['click','keydown','scroll','mousemove','touchstart'].forEach(function(evt){
      window.addEventListener(evt, loadGTM, {once:true, passive:true});
    });
  })();
</script>
